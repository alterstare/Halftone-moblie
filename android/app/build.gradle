apply plugin: 'com.android.application'

android {
    namespace = "com.noth2.mangamanager"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.noth2.mangamanager"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 531
        versionName "0.6.14"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: the key lives OUTSIDE the repo (~/.halftone/keystore.properties
    // + the keystore next to it). Updates only install over a build signed with
    // the same key, so keep that folder backed up.
    // With `lineage` set (2026-10-25 key rotation) the release APK is built
    // unsigned and signed by the signRelease task below instead.
    def ksDir = new File(System.getProperty("user.home"), ".halftone")
    def ksProps = new File(ksDir, "keystore.properties")
    def ks = new Properties()
    if (ksProps.exists()) ksProps.withInputStream { ks.load(it) }
    def rotated = ks['lineage'] != null
    signingConfigs {
        if (ksProps.exists() && !rotated) {
            def p = ks
            release {
                storeFile new File(ksDir, p['storeFile'])
                storePassword p['storePassword']
                keyAlias p['keyAlias']
                keyPassword p['keyPassword']
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
    buildTypes {
        release {
            if (ksProps.exists() && !rotated) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Release signing with the rotated key: APK Signature Scheme v3 only (minSdk
// 28), new key + the lineage proof signed by the old one (= the debug key
// earlier releases used), so installed apps accept the update. v1/v2 are off:
// they could only carry the old key.
def halftoneKs = new File(System.getProperty("user.home"), ".halftone")
tasks.register('signRelease', Exec) {
    def p = new Properties()
    def f = new File(halftoneKs, "keystore.properties")
    if (f.exists()) f.withInputStream { p.load(it) }
    onlyIf { p['lineage'] != null }
    def out = layout.buildDirectory.dir("outputs/apk/release").get().asFile
    def tool = "${android.sdkDirectory}/build-tools/${android.buildToolsVersion}/apksigner" +
        (System.getProperty("os.name").toLowerCase().contains("windows") ? ".bat" : "")
    workingDir halftoneKs
    environment 'OLD_PASS', p['storePassword'] ?: ''
    environment 'OLD_KEY_PASS', p['keyPassword'] ?: ''
    environment 'NEW_PASS', p['newStorePassword'] ?: ''
    environment 'NEW_KEY_PASS', p['newKeyPassword'] ?: ''
    commandLine tool, 'sign',
        '--v1-signing-enabled', 'false', '--v2-signing-enabled', 'false', '--v3-signing-enabled', 'true', '--v4-signing-enabled', 'false',
        '--rotation-min-sdk-version', '28',
        '--ks', p['storeFile'] ?: '', '--ks-key-alias', p['keyAlias'] ?: '',
        '--ks-pass', 'env:OLD_PASS', '--key-pass', 'env:OLD_KEY_PASS',
        '--next-signer',
        '--ks', p['newStoreFile'] ?: '', '--ks-key-alias', p['newKeyAlias'] ?: '',
        '--ks-pass', 'env:NEW_PASS', '--key-pass', 'env:NEW_KEY_PASS',
        '--lineage', p['lineage'] ?: '',
        '--out', new File(out, "app-release.apk").path,
        new File(out, "app-release-unsigned.apk").path
}
afterEvaluate {
    tasks.named('assembleRelease').configure { finalizedBy 'signRelease' }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // NAS: SMB2/3 client; credentials kept with the Android keystore.
    implementation "com.hierynomus:smbj:0.13.0"
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
